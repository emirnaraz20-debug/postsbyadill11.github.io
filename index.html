
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts by Adil</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#242424;font-family:Georgia,serif}
header{padding:35px 8%;border-bottom:1px solid #ddd}
h1{font-size:32px;margin:0}
header p{color:#777;margin:8px 0 0;font-family:Arial}
main{max-width:1000px;margin:45px auto;padding:0 20px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
input,select{padding:12px;border:1px solid #ddd;background:white;font-size:15px}
input{flex:1;min-width:180px}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
.post{background:white;border:1px solid #eee;padding:25px}
.post small{color:#888;font-family:Arial}
.post h2{font-size:23px;line-height:1.3}
.post p{color:#666;line-height:1.7}
.post button{border:0;background:#222;color:white;padding:10px 16px;cursor:pointer}
#reader{display:none;background:white;padding:35px;margin-top:30px;line-height:1.9}
#reader button{padding:10px 18px}
footer{text-align:center;padding:35px;color:#888;font:13px Arial}
</style>
</head>
<body>

<header>
<h1>Posts by Adil</h1>
<p>Articles, ideas and reflections.</p>
</header>

<main>
<div class="toolbar">
<input id="search" placeholder="Search articles..." oninput="renderPosts()">
<select id="category" onchange="renderPosts()">
<option value="">All Categories</option>
</select>
</div>

<div class="posts" id="posts"></div>

<article id="reader">
<button onclick="closePost()">← Back to articles</button>
<h1 id="readTitle"></h1>
<p id="readMeta"></p>
<div id="readContent"></div>
</article>
</main>

<footer>© <span id="year"></span> Posts by Adil</footer>

<script>
// EDIT YOUR POSTS HERE
const POSTS = [
{
 title: "The Purpose of Education",
 category: "Education",
 date: "2026-11-18",
 excerpt: "Education should develop the mind, character and sense of responsibility.",
 content: `
 <p>Education is more than examinations and certificates.</p>
 <p>True learning develops critical thinking, character and responsibility.</p>
 `
},
{
 title: "The Value of Reading",
 category: "Ideas",
 date: "2026-11-17",
 excerpt: "Reading helps us understand the world beyond our immediate experience.",
 content: `
 <p>Reading introduces us to ideas, histories and perspectives.</p>
 <p>A thoughtful reader learns to question, examine and understand.</p>
 `
}
];

const postsEl = document.getElementById("posts");

function setupCategories(){
 const categories = [...new Set(POSTS.map(p=>p.category))];
 document.getElementById("category").innerHTML =
 '<option value="">All Categories</option>' +
 categories.map(c=>`<option>${escapeHTML(c)}</option>`).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, c => ({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 })[c]);
}

function renderPosts(){
 const query = document.getElementById("search").value.toLowerCase();
 const category = document.getElementById("category").value;

 const filtered = POSTS.filter(p =>
 (p.title.toLowerCase().includes(query) ||
 p.excerpt.toLowerCase().includes(query)) &&
 (!category || p.category===category)
 );

 postsEl.innerHTML = filtered.map((p,i)=>`
 <div class="post">
 <small>${escapeHTML(p.category)} · ${escapeHTML(p.date)}</small>
 <h2>${escapeHTML(p.title)}</h2>
 <p>${escapeHTML(p.excerpt)}</p>
 <button onclick="openPost(${POSTS.indexOf(p)})">Read Article</button>
 </div>
 `).join("") || "<p>No articles found.</p>";
}

function openPost(index){
 const p=POSTS[index];
 document.getElementById("readTitle").textContent=p.title;
 document.getElementById("readMeta").textContent=p.category+" · "+p.date;
 document.getElementById("readContent").innerHTML=p.content;
 document.getElementById("reader").style.display="block";
 postsEl.style.display="none";
 window.scrollTo(0,0);
}

function closePost(){
 document.getElementById("reader").style.display="none";
 postsEl.style.display="grid";
}

document.getElementById("year").textContent=new Date().getFullYear();
setupCategories();
renderPosts();
</script>
</body>
</html>
